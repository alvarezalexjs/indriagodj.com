<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indriago — DJ / Producer</title>
<meta name="description" content="Official website of Indriago, DJ and producer. Music, tour dates, gallery and booking.">
<link rel="canonical" href="https://indriagodj.com/">
<meta property="og:title" content="Indriago — DJ / Producer">
<meta property="og:description" content="Official website of Indriago. Music, tour dates and booking.">
<meta property="og:image" content="https://indriagodj.com/assets/og.jpg">
<meta property="og:url" content="https://indriagodj.com/">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ====== EDITA AQUÍ ====== fuentes (Google Fonts): Inter Tight (títulos) + Inter (texto) + JetBrains Mono (etiquetas) */
  /* ====== EDITA AQUÍ ====== colores */
  :root{
    --ink:#0b0b0b; --deep:#141414; --panel:#1b1b1b; --grey:#5f5f5f; --grey-deep:#262626;
    --fd:"Inter Tight","Helvetica Neue",Arial,sans-serif; --fm:"JetBrains Mono",ui-monospace,monospace;
    --mid:#a3a3a3; --line:rgba(255,255,255,.1); --paper:#ededeb; --gut:clamp(16px,4vw,56px);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:72px}
  body{background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .display{font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:.9}
  .eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);font-weight:600;display:flex;gap:14px;align-items:center}
  .eyebrow b{color:var(--paper);font-weight:600}
  .eyebrow::after{content:"";height:1px;width:48px;background:var(--line)}
  .wrap{max-width:1280px;margin:0 auto;padding:0 var(--gut)}
  section{position:relative}
  .btn{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(237,237,235,.55);padding:12px 18px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;transition:background .2s,color .2s,border-color .2s}
  .btn:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .btn.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .btn.solid:hover{background:transparent;color:var(--paper)}
  .tbd{display:inline-block;font-family:var(--fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;border:1px dashed rgba(255,255,255,.35);color:var(--mid);padding:3px 7px;vertical-align:middle}

  /* ---------- nav ---------- */
  .nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:18px var(--gut);transition:background .3s,padding .3s,border-color .3s;border-bottom:1px solid transparent}
  .nav.scrolled{background:rgba(11,11,11,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:12px;padding-bottom:12px;border-color:var(--line)}
  .nav .logo{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
  .nav ul{list-style:none;display:flex;gap:28px}
  .nav ul a{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.8;transition:opacity .2s}
  .nav ul a:hover,.nav ul a.on{opacity:1}
  .nav ul a span{font-family:var(--fm);color:var(--mid);margin-right:6px;font-weight:400}
  .nav ul a b{font-weight:inherit}
  .burger{display:none;background:none;border:0;color:inherit;width:40px;height:40px;cursor:pointer;position:relative}
  .burger i{position:absolute;left:9px;right:9px;height:2px;background:currentColor;transition:transform .25s,opacity .25s}
  .burger i:nth-child(1){top:13px}.burger i:nth-child(2){top:19px}.burger i:nth-child(3){top:25px}
  .menu-open .burger i:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .menu-open .burger i:nth-child(2){opacity:0}
  .menu-open .burger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

  /* ---------- hero ---------- */
  .hero{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr auto;isolation:isolate;overflow:hidden}
  .hero .photo{position:absolute;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 75% 40%,#6a6a6a 0%,var(--grey) 45%,var(--grey-deep) 100%)}
  .hero .photo img{position:absolute;right:0;top:0;height:100%;width:auto;max-width:none;animation:zoom 14s ease-out both;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
  .hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--grey-deep) 0%,rgba(38,38,38,.55) 40%,rgba(38,38,38,0) 62%),linear-gradient(0deg,rgba(11,11,11,.9) 0%,rgba(0,0,0,0) 30%)}
  @keyframes zoom{from{transform:scale(1.06)}to{transform:scale(1)}}
  .hero main{align-self:center;padding:110px var(--gut) 40px;max-width:900px}
  .hero h1{font-size:clamp(54px,10.4vw,150px);position:relative;z-index:0;text-shadow:0 0 14px rgba(255,255,255,.16),0 0 48px rgba(255,255,255,.08);animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
  .hero h1::before{content:"";position:absolute;z-index:-1;left:-12%;right:-18%;top:-45%;bottom:-45%;background:radial-gradient(closest-side,rgba(255,255,255,.22),rgba(225,225,225,.08) 55%,rgba(200,200,200,0) 100%);filter:blur(36px);pointer-events:none;animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
  .hero .role{font-family:var(--fd);text-transform:uppercase;font-size:clamp(18px,2.6vw,32px);color:var(--mid);margin-top:14px;animation:rise 1s .15s cubic-bezier(.2,.7,.2,1) both}
  .hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;animation:rise 1s .3s cubic-bezier(.2,.7,.2,1) both}
  .hero .scroll{position:absolute;right:var(--gut);bottom:84px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;writing-mode:vertical-rl;opacity:.7}
  .hero .scroll::after{content:"";display:block;width:1px;height:60px;background:var(--paper);margin:14px auto 0;animation:drip 2.2s ease-in-out infinite;transform-origin:top}
  @keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  .ticker{background:var(--ink);overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .ticker .track{display:inline-flex;animation:marquee 34s linear infinite}
  .ticker span{font-family:var(--fd);text-transform:uppercase;font-size:clamp(14px,1.5vw,17px);letter-spacing:.04em;padding:13px 0}
  .ticker span::after{content:"✦";margin:0 22px;color:var(--mid);font-size:.8em;vertical-align:middle}
  .ticker.big span{font-size:clamp(36px,6vw,82px);padding:18px 0;color:transparent;-webkit-text-stroke:1px rgba(237,237,235,.45)}
  .ticker.big span:nth-child(odd){color:var(--paper);-webkit-text-stroke:0}
  .ticker.big .track{animation-duration:50s}
  @keyframes marquee{to{transform:translateX(-50%)}}

  /* ---------- secciones ---------- */
  .block{padding:clamp(80px,12vw,150px) 0}
  .block h2{font-size:clamp(40px,6.4vw,86px);margin:18px 0 0}
  .block h2 em{font-style:normal;color:transparent;-webkit-text-stroke:1px rgba(237,237,235,.6)}

  /* bio */
  .bio{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(32px,6vw,90px);align-items:start;margin-top:56px}
  .bio figure{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--panel)}
  .bio figure img{width:100%;height:100%;object-fit:cover;filter:contrast(1.05)}
  .bio figure figcaption{position:absolute;left:16px;bottom:14px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .tags span{font-family:var(--fm);border:1px solid var(--line);padding:7px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
  .bio .text p{font-size:clamp(16px,1.35vw,18px);color:#cfcfcd;margin-bottom:18px;max-width:58ch}
  .bio .text p:first-of-type{font-size:clamp(20px,2vw,26px);color:var(--paper);line-height:1.4}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:36px}
  .stats div{padding:22px 0 0}
  .stats div+div{padding-left:20px;border-left:1px solid var(--line)}
  .stats b{display:block;font-family:var(--fd);font-weight:700;font-size:clamp(30px,3.8vw,48px);line-height:1}
  .stats small{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}

  /* música */
  .music{background:var(--deep);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .music-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(28px,5vw,70px);margin-top:56px;align-items:start}
  .player{border:1px solid var(--line);background:var(--ink);min-height:360px;display:grid}
  .player iframe{width:100%;height:100%;min-height:360px;border:0;filter:grayscale(1)}
  .player .empty{display:grid;place-content:center;text-align:center;gap:14px;padding:40px;color:var(--mid)}
  .player .empty .display{font-size:30px;color:var(--paper)}
  .platforms{list-style:none;border-top:1px solid var(--line)}
  .platforms a{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);font-family:var(--fd);text-transform:uppercase;font-size:clamp(18px,2vw,26px);transition:padding .25s,color .25s}
  .platforms a::after{content:"↗";font-family:Inter,sans-serif;font-size:20px;color:var(--mid)}
  .platforms a:hover{padding-left:14px;color:#fff}

  /* fechas */
  .dates h3{font-family:var(--fm);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);font-weight:600;margin:56px 0 10px}
  .gig{display:grid;grid-template-columns:150px 1.2fr 1fr 130px;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);transition:background .2s,padding .25s}
  .gig:first-of-type{border-top:1px solid var(--line)}
  .gig:hover{background:rgba(255,255,255,.03);padding-left:12px;padding-right:12px}
  .gig .d{font-family:var(--fd);font-weight:700;font-size:23px;line-height:1}
  .gig .d small{display:block;font-family:var(--fm);font-weight:400;font-size:11px;letter-spacing:.1em;color:var(--mid);margin-top:6px}
  .gig .where{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:clamp(17px,1.8vw,23px);line-height:1.05}
  .gig .venue{font-family:var(--fm);color:var(--mid);font-size:13px;letter-spacing:.02em}
  .gig.past{opacity:.55}
  .gig .btn{padding:10px 14px;font-size:11px;justify-self:end}

  /* galería */
  .gallery{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:56px}
  .gallery button{position:relative;overflow:hidden;border:0;padding:0;background:var(--panel);cursor:zoom-in}
  .gallery img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .4s;filter:grayscale(1) brightness(.92)}
  .gallery button:hover img{transform:scale(1.04);filter:grayscale(1) brightness(1.05)}
  .g1{grid-column:span 5;aspect-ratio:2/3}
  .g2{grid-column:span 4;aspect-ratio:2/3;margin-top:80px}
  .g3{grid-column:span 3;display:grid;gap:10px;align-content:start}
  .g3 button{aspect-ratio:1}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(5,5,5,.94);display:none;place-items:center;padding:24px}
  .lightbox.open{display:grid}
  .lightbox img{max-height:88vh;width:auto}
  .lightbox button{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--line);color:var(--paper);width:44px;height:44px;font-size:22px;cursor:pointer}

  /* booking */
  .booking{text-align:center}
  .booking h2{font-size:clamp(50px,9.4vw,128px)}
  .booking .lead{max-width:560px;margin:22px auto 0;color:#cfcfcd}
  .mail{display:inline-block;margin-top:34px;font-family:var(--fd);font-weight:700;font-size:clamp(20px,3.2vw,42px);text-transform:uppercase;border-bottom:2px solid var(--paper);padding-bottom:6px;transition:color .2s,border-color .2s;word-break:break-all}
  .mail:hover{color:var(--mid);border-color:var(--mid)}
  .contacts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:70px auto 0;max-width:980px;border-top:1px solid var(--line);text-align:left}
  .contacts div{padding:24px 20px 0}
  .contacts div+div{border-left:1px solid var(--line)}
  .contacts small{display:block;font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin-bottom:8px}
  .contacts a{font-weight:600}
  .socials{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:56px}

  footer{border-top:1px solid var(--line);padding:28px var(--gut);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
  footer .logo{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--paper)}

  /* aparición al hacer scroll */
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  /* ---------- móvil ---------- */
  @media (max-width:900px){
    .nav ul{position:fixed;inset:0;background:rgba(11,11,11,.97);flex-direction:column;justify-content:center;align-items:center;gap:26px;opacity:0;pointer-events:none;transition:opacity .3s}
    .nav ul a{font-family:var(--fd);font-size:30px;letter-spacing:0;font-weight:700;opacity:1}
    .nav ul a span{font-family:var(--fm);font-size:13px;vertical-align:top}
    .menu-open .nav ul{opacity:1;pointer-events:auto}
    .burger{display:block;z-index:2}
    .bio,.music-grid{grid-template-columns:1fr}
    .bio figure{max-height:70vh}
    .gig{grid-template-columns:90px 1fr;gap:6px 16px}
    .gig .d{grid-row:span 2;font-size:21px}
    .gig .btn{grid-column:2;justify-self:start;margin-top:8px}
    .gallery{grid-template-columns:repeat(2,1fr)}
    .g1,.g2{grid-column:span 1;margin-top:0}
    .g3{grid-column:span 2;grid-template-columns:1fr 1fr}
    .contacts{grid-template-columns:1fr}
    .contacts div+div{border-left:0;border-top:1px solid var(--line);margin-top:22px}
  }
  @media (max-width:760px){
    .hero .photo img{right:50%;transform:translateX(50%);animation:none;-webkit-mask-image:none;mask-image:none}
    .hero .photo::after{background:linear-gradient(0deg,var(--ink) 0%,rgba(30,30,30,.8) 38%,rgba(38,38,38,0) 62%,rgba(0,0,0,.3) 100%)}
    .hero main{align-self:end;padding-top:46vh}
    .hero .scroll{display:none}
    .stats div+div{padding-left:12px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}
  /* logo */
  .nav .logo img{height:38px;width:auto;transition:height .3s}
  .nav.scrolled .logo img{height:32px}
  footer .logo img{height:30px;width:auto}
  /* botón de idioma (esfera del mundo) */
  .nav .right{display:flex;align-items:center;gap:18px}
  .lang{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid rgba(237,237,235,.35);color:inherit;border-radius:999px;padding:6px 12px 6px 7px;cursor:pointer;font-family:var(--fm);font-size:12px;letter-spacing:.08em;transition:background .2s,color .2s,border-color .2s;z-index:2}
  .lang:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .lang:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
  .lang svg{width:22px;height:22px;flex:none;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .lang:hover svg{transform:rotate(180deg)}
  .lang .on{color:inherit;font-weight:700}
  .lang .off{opacity:.45}
  .lang:hover .off{opacity:.6}
</style>
</head>
<body>

<header class="nav" id="nav">
  <a class="logo" href="#top" aria-label="Indriago"><img src="assets/logo-sm.png" alt="Indriago" width="180" height="89"></a>
  <div class="right">
    <nav>
      <ul id="menu">
        <li><a href="#bio"><span>01</span><b data-i18n="navBio"></b></a></li>
        <li><a href="#music"><span>02</span><b data-i18n="navMusic"></b></a></li>
        <li><a href="#dates"><span>03</span><b data-i18n="navDates"></b></a></li>
        <li><a href="#gallery"><span>04</span><b data-i18n="navGallery"></b></a></li>
        <li><a href="#booking"><span>05</span><b data-i18n="navBooking"></b></a></li>
      </ul>
    </nav>
    <button class="lang" id="lang" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4.2" ry="10"/><path d="M2 12h20M4 6.5h16M4 17.5h16"/></svg>
      <span><span data-l="en">EN</span> / <span data-l="es">ES</span></span>
    </button>
    <button class="burger" id="burger" aria-expanded="false"><i></i><i></i><i></i></button>
  </div>
</header>

<section class="hero" id="top">
  <div class="photo"><img src="assets/hero.jpg" data-i18n-alt="altHero" alt="" fetchpriority="high"></div>
  <main>
    <div class="eyebrow" data-k="heroKicker"></div>
    <h1 class="display">Indriago</h1>
    <div class="role" data-k="role"></div>
    <div class="cta">
      <a class="btn solid" href="#music" data-i18n="ctaListen"></a>
      <a class="btn" href="#dates" data-i18n="navDates"></a>
      <a class="btn" href="#booking" data-i18n="navBooking"></a>
    </div>
  </main>
  <div class="scroll" aria-hidden="true">Scroll</div>
  <div class="ticker" aria-hidden="true"><div class="track" data-ticker="ticker"></div></div>
</section>

<!-- 01 BIO -->
<section class="block" id="bio">
  <div class="wrap">
    <div class="eyebrow reveal"><b>01</b> <span data-i18n="navBio"></span></div>
    <h2 class="display reveal" data-i18n-html="bioTitle"></h2>
    <div class="bio">
      <figure class="reveal"><img src="assets/sentado.jpg" data-i18n-alt="altSeated" alt="" loading="lazy"><figcaption>Indriago · <span data-k="role"></span></figcaption></figure>
      <div class="text reveal">
        <div class="tags" id="tags"></div>
        <div id="bioText"></div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>
</section>

<!-- 02 MUSIC -->
<section class="block music" id="music">
  <div class="wrap">
    <div class="eyebrow reveal"><b>02</b> <span data-i18n="navMusic"></span></div>
    <h2 class="display reveal" data-i18n-html="musicTitle"></h2>
    <div class="music-grid">
      <div class="player reveal" id="player"></div>
      <ul class="platforms reveal" id="platforms"></ul>
    </div>
  </div>
</section>

<!-- 03 DATES -->
<section class="block dates" id="dates">
  <div class="wrap">
    <div class="eyebrow reveal"><b>03</b> <span data-i18n="navDates"></span></div>
    <h2 class="display reveal">Tour <em>dates</em></h2>
    <h3 class="reveal" data-i18n="upcoming"></h3>
    <div id="upcoming"></div>
    <h3 class="reveal" data-i18n="past"></h3>
    <div id="past"></div>
  </div>
</section>

<div class="ticker big" aria-hidden="true"><div class="track" data-ticker="bigTicker"></div></div>

<!-- 04 GALLERY -->
<section class="block" id="gallery">
  <div class="wrap">
    <div class="eyebrow reveal"><b>04</b> <span data-i18n="navGallery"></span></div>
    <h2 class="display reveal" data-i18n="navGallery"></h2>
    <div class="gallery reveal">
      <button class="g1" data-full="assets/escalera.jpg"><img src="assets/escalera.jpg" data-i18n-alt="altStairs" alt="" loading="lazy"></button>
      <button class="g2" data-full="assets/hero.jpg"><img src="assets/hero.jpg" data-i18n-alt="altHero" alt="" loading="lazy"></button>
      <div class="g3">
        <button data-full="assets/sentado.jpg"><img src="assets/sentado-detalle.jpg" data-i18n-alt="altSeated" alt="" loading="lazy"></button>
        <button data-full="assets/escalera.jpg"><img src="assets/escalera-detalle.jpg" data-i18n-alt="altStairs" alt="" loading="lazy"></button>
      </div>
    </div>
  </div>
</section>

<section class="block booking music" id="booking">
  <div class="wrap">
    <div class="eyebrow reveal" style="justify-content:center"><b>05</b> Booking</div>
    <h2 class="display reveal">Booking</h2>
    <p class="lead reveal" data-k="bookingLead"></p>
    <a class="mail reveal" id="mail"></a>
    <div class="contacts reveal" id="contacts"></div>
    <div class="socials reveal" id="socials"></div>
  </div>
</section>

<footer>
  <span class="logo"><img src="assets/logo-sm.png" alt="Indriago" width="180" height="89"></span>
  <span>© <span id="y">2026</span> Indriago · <span data-k="role"></span></span>
  <a href="#top" data-i18n="backTop"></a>
</footer>

<div class="lightbox" id="lb" role="dialog" aria-modal="true"><img alt=""><button>×</button></div>

<script>
/* =====================================================================
   ====== EDITA AQUÍ ====== Todo el contenido de la web está aquí.
   Cada texto tiene versión en inglés (en) y español (es).
   La web abre en inglés; el botón del mundo cambia a español.
   Lo marcado con  pendiente:true  muestra una etiqueta "Provisional"
   hasta que pongas el dato real.
   ===================================================================== */
var SITE = {
  heroKicker: { en: "Official website", es: "Web oficial" },
  role:       { en: "DJ / Producer",    es: "DJ / Productor" },
  ticker: {
    en: ["Indriago", "DJ / Producer", "Bookings open", "indriagodj.com"],
    es: ["Indriago", "DJ / Productor", "Booking abierto", "indriagodj.com"]
  },
  bigTicker: { en: ["Indriago", "On tour", "Indriago", "Live sets"], es: ["Indriago", "On tour", "Indriago", "Live sets"] },

  tags: { en: ["House", "Tech House", "Open format", "Venezuela"],      // PROVISIONAL: géneros / origen
          es: ["House", "Tech House", "Open format", "Venezuela"] },
  bio: {                                                               // PROVISIONAL: biografía
    en: [
      "Placeholder: a strong opening line introducing Indriago and his sound.",
      "Second placeholder paragraph: career path, clubs and cities he has played, and key moments.",
      "Third placeholder paragraph: musical style, influences and what the crowd can expect from his sets."
    ],
    es: [
      "Texto provisional: aquí va una frase potente que presente a Indriago y su sonido.",
      "Segundo párrafo provisional: trayectoria, clubes y ciudades donde ha tocado, y los momentos clave de su carrera.",
      "Tercer párrafo provisional: estilo musical, influencias y lo que el público puede esperar de sus sets."
    ]
  },
  bioPendiente: true,
  stats: [ ["10+", { en: "Years", es: "Años" }], ["100+", { en: "Shows", es: "Shows" }], ["5", { en: "Countries", es: "Países" }] ], // PROVISIONAL
  statsPendiente: true,

  // Reproductor: pega la URL "embed" de SoundCloud, Mixcloud, Spotify o YouTube.
  // Ej. SoundCloud: https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/USUARIO&color=%23111111&visual=true
  playerEmbed: "",
  platforms: [                                                         // PROVISIONAL: enlaces
    ["SoundCloud", "https://soundcloud.com/indriago"],
    ["Spotify", "#"],
    ["Mixcloud", "#"],
    ["YouTube", "#"]
  ],
  platformsPendiente: true,

  // Fechas: [fecha "AAAA-MM-DD", ciudad, país, club/evento, enlace entradas]
  // (ciudad, país y club se escriben una sola vez; si quieres traducirlos usa { en: "...", es: "..." })
  upcoming: [                                                          // PROVISIONAL
    ["2026-12-20", { en: "City", es: "Ciudad" }, { en: "Country", es: "País" }, { en: "Club / event TBA", es: "Club / evento por anunciar" }, "#"],
    ["2027-01-10", { en: "City", es: "Ciudad" }, { en: "Country", es: "País" }, { en: "Club / event TBA", es: "Club / evento por anunciar" }, "#"]
  ],
  past: [                                                              // PROVISIONAL
    ["2026-10-31", { en: "City", es: "Ciudad" }, { en: "Country", es: "País" }, { en: "Club / event", es: "Club / evento" }, ""],
    ["2026-09-14", { en: "City", es: "Ciudad" }, { en: "Country", es: "País" }, { en: "Club / event", es: "Club / evento" }, ""]
  ],
  datesPendiente: true,

  bookingLead: {
    en: "For club nights, festivals and private events, get in touch and we will get back to you as soon as possible.",
    es: "Para contrataciones, festivales, clubes y eventos privados, escríbenos y te respondemos lo antes posible."
  },
  email: "booking@indriagodj.com",                                    // PROVISIONAL
  contacts: [                                                          // PROVISIONAL
    ["Booking", "booking@indriagodj.com", "mailto:booking@indriagodj.com"],
    ["Management", { en: "TBC", es: "Por confirmar" }, ""],
    [{ en: "Press", es: "Prensa" }, { en: "TBC", es: "Por confirmar" }, ""]
  ],
  socials: [                                                           // PROVISIONAL
    ["Instagram", "https://instagram.com/indriago"],
    ["SoundCloud", "https://soundcloud.com/indriago"],
    ["TikTok", "#"],
    ["YouTube", "#"]
  ],
  contactPendiente: true
};

/* Textos fijos de la interfaz (menú, botones, títulos) */
var UI = {
  en: {
    navBio: "Bio", navMusic: "Music", navDates: "Dates", navGallery: "Gallery", navBooking: "Booking",
    ctaListen: "Listen", bioTitle: "About <em>Indriago</em>", musicTitle: "Sets <em>&amp;</em> music",
    upcoming: "Upcoming", past: "Recent", tickets: "Tickets", noDates: "New dates coming soon.",
    lastSet: "Latest set", playerSoon: "The SoundCloud / Mixcloud / YouTube player goes here.",
    tbd: "Placeholder", pending: "Pending", backTop: "Back to top ↑",
    menuOpen: "Open menu", close: "Close", photo: "Enlarged photo", player: "Player",
    langLabel: "Cambiar a español", other: "es",
    altHero: "Black and white portrait of Indriago wearing glasses", altSeated: "Indriago seated, black and white portrait", altStairs: "Indriago on a staircase",
    months: ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"],
    title: "Indriago — DJ / Producer", desc: "Official website of Indriago, DJ and producer. Music, tour dates, gallery and booking."
  },
  es: {
    navBio: "Bio", navMusic: "Música", navDates: "Fechas", navGallery: "Galería", navBooking: "Booking",
    ctaListen: "Escuchar", bioTitle: "Sobre <em>Indriago</em>", musicTitle: "Sets <em>&amp;</em> música",
    upcoming: "Próximas", past: "Recientes", tickets: "Entradas", noDates: "Nuevas fechas muy pronto.",
    lastSet: "Último set", playerSoon: "Aquí irá el reproductor de SoundCloud / Mixcloud / YouTube.",
    tbd: "Provisional", pending: "Pendiente", backTop: "Volver arriba ↑",
    menuOpen: "Abrir menú", close: "Cerrar", photo: "Foto ampliada", player: "Reproductor",
    langLabel: "Switch to English", other: "en",
    altHero: "Retrato de Indriago con gafas en blanco y negro", altSeated: "Indriago sentado, retrato en blanco y negro", altStairs: "Indriago en una escalera",
    months: ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"],
    title: "Indriago — DJ / Productor", desc: "Web oficial de Indriago, DJ y productor. Música, fechas, galería y booking."
  }
};
/* ===================================================================== */

(function(){
  var $ = function(s){return document.querySelector(s)};
  var $$ = function(s){return document.querySelectorAll(s)};
  var esc = function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var ext = function(u){return /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : ''};
  var lang = "en";
  var T = function(v){ return (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] != null ? v[lang] : v.en) : v };

  function render(){
    var ui = UI[lang], TBD = ' <span class="tbd">'+ui.tbd+'</span>';
    document.documentElement.lang = lang;
    document.title = ui.title;
    var md = document.querySelector('meta[name="description"]'); if (md) md.content = ui.desc;
    $$("[data-i18n]").forEach(function(el){ el.textContent = ui[el.dataset.i18n] });
    $$("[data-i18n-html]").forEach(function(el){ el.innerHTML = ui[el.dataset.i18nHtml] });
    $$("[data-i18n-alt]").forEach(function(el){ el.alt = ui[el.dataset.i18nAlt] });
    $$("[data-k]").forEach(function(el){ el.textContent = T(SITE[el.dataset.k]) || "" });
    $$("[data-ticker]").forEach(function(el){
      var h="", list=T(SITE[el.dataset.ticker]); for(var i=0;i<6;i++) list.forEach(function(p){h+="<span>"+esc(p)+"</span>"}); el.innerHTML=h;
    });

    $("#tags").innerHTML = T(SITE.tags).map(function(t){return "<span>"+esc(t)+"</span>"}).join("");
    $("#bioText").innerHTML = T(SITE.bio).map(function(p,i){return "<p>"+esc(p)+(i===0&&SITE.bioPendiente?TBD:"")+"</p>"}).join("");
    $("#stats").innerHTML = SITE.stats.map(function(s){return "<div><b>"+esc(s[0])+"</b><small>"+esc(T(s[1]))+"</small></div>"}).join("");

    $("#player").innerHTML = SITE.playerEmbed
      ? '<iframe src="'+esc(SITE.playerEmbed)+'" loading="lazy" allow="autoplay; encrypted-media" title="'+ui.player+'"></iframe>'
      : '<div class="empty"><span class="display">'+ui.lastSet+'</span><span>'+ui.playerSoon+'</span><span class="tbd" style="justify-self:center">'+ui.pending+'</span></div>';
    $("#platforms").innerHTML = SITE.platforms.map(function(p){return '<li><a href="'+esc(p[1])+'"'+ext(p[1])+'>'+esc(p[0])+'</a></li>'}).join("")
      + (SITE.platformsPendiente ? '<li style="padding-top:12px">'+TBD+'</li>' : '');

    function gig(g, past){
      var d=g[0].split("-");
      return '<div class="gig reveal in'+(past?' past':'')+'"><div class="d">'+d[2]+' '+ui.months[+d[1]-1]+'<small>'+d[0]+'</small></div>'
        +'<div class="where">'+esc(T(g[1]))+', '+esc(T(g[2]))+'</div><div class="venue">'+esc(T(g[3]))+'</div>'
        +(g[4] ? '<a class="btn" href="'+esc(g[4])+'"'+ext(g[4])+'>'+ui.tickets+'</a>' : '<span></span>')+'</div>';
    }
    $("#upcoming").innerHTML = SITE.upcoming.length ? SITE.upcoming.map(function(g){return gig(g)}).join("") : '<p style="color:var(--mid)">'+ui.noDates+'</p>';
    $("#past").innerHTML = SITE.past.map(function(g){return gig(g,true)}).join("") + (SITE.datesPendiente ? '<p style="margin-top:16px">'+TBD+'</p>' : '');

    var mail=$("#mail"); mail.textContent=SITE.email; mail.href="mailto:"+SITE.email;
    $("#contacts").innerHTML = SITE.contacts.map(function(c){
      return "<div><small>"+esc(T(c[0]))+"</small>"+(c[2]?'<a href="'+esc(c[2])+'">'+esc(T(c[1]))+"</a>":"<span>"+esc(T(c[1]))+"</span>")+"</div>";
    }).join("");
    $("#socials").innerHTML = SITE.socials.map(function(s){return '<a class="btn" href="'+esc(s[1])+'"'+ext(s[1])+'>'+esc(s[0])+'</a>'}).join("")
      + (SITE.contactPendiente ? '<div style="width:100%;margin-top:6px">'+TBD+'</div>' : '');

    // botón de idioma
    var lb = $("#lang");
    lb.setAttribute("aria-label", ui.langLabel); lb.title = ui.langLabel;
    lb.querySelectorAll("[data-l]").forEach(function(s){ s.className = s.dataset.l===lang ? "on" : "off" });
    $("#burger").setAttribute("aria-label", ui.menuOpen);
    $("#lb").setAttribute("aria-label", ui.photo); $("#lb button").setAttribute("aria-label", ui.close);
  }

  function setLang(l){ lang = (l==="es") ? "es" : "en"; try{ localStorage.setItem("lang", lang) }catch(e){} render() }
  var saved = null; try{ saved = localStorage.getItem("lang") }catch(e){}
  if (/^#?es$/.test(location.hash)) saved = "es";
  lang = saved==="es" ? "es" : "en";
  render();
  $("#lang").addEventListener("click", function(){ setLang(lang==="en" ? "es" : "en") });
  $("#y").textContent = new Date().getFullYear();

  // nav: fondo al hacer scroll + menú móvil + sección activa
  var nav=$("#nav"), burger=$("#burger");
  function onScroll(){ nav.classList.toggle("scrolled", scrollY>40) }
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
  function setMenu(open){ document.body.classList.toggle("menu-open",open); burger.setAttribute("aria-expanded",open); document.body.style.overflow=open?"hidden":"" }
  burger.addEventListener("click", function(){ setMenu(!document.body.classList.contains("menu-open")) });
  $$("#menu a").forEach(function(a){ a.addEventListener("click", function(){ setMenu(false) }) });

  if ("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12});
    $$(".reveal:not(.in)").forEach(function(el){io.observe(el)});
    var links={}; $$("#menu a").forEach(function(a){links[a.getAttribute("href").slice(1)]=a});
    var so=new IntersectionObserver(function(es){es.forEach(function(e){ if(e.isIntersecting){ for(var k in links) links[k].classList.toggle("on", k===e.target.id) } })},{rootMargin:"-45% 0px -50% 0px"});
    $$("section[id]").forEach(function(s){so.observe(s)});
  } else $$(".reveal").forEach(function(el){el.classList.add("in")});

  // galería: ampliar foto
  var lbx=$("#lb");
  $$(".gallery button").forEach(function(b){ b.addEventListener("click", function(){ lbx.querySelector("img").src=b.dataset.full; lbx.classList.add("open") }) });
  lbx.addEventListener("click", function(e){ if(e.target!==lbx.querySelector("img")) lbx.classList.remove("open") });
  addEventListener("keydown", function(e){ if(e.key==="Escape"){ lbx.classList.remove("open"); setMenu(false) } });
})();
</script>
</body>
</html>
