<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indriago — DJ / Producer</title>
<meta name="description" content="Official website of Indriago, DJ and producer. Music, tour dates, gallery and booking.">
<link rel="canonical" href="https://indriagodj.com/">
<meta property="og:title" content="Indriago — DJ / Producer">
<meta property="og:description" content="Official website of Indriago. Music, tour dates and booking.">
<meta property="og:image" content="https://indriagodj.com/assets/og.jpg">
<meta property="og:url" content="https://indriagodj.com/">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ====== EDITA AQUÍ ====== fuentes (Google Fonts): Inter Tight (títulos) + Inter (texto) + JetBrains Mono (etiquetas) */
  /* ====== EDITA AQUÍ ====== colores */
  :root{
    --ink:#0b0b0b; --deep:#141414; --panel:#1b1b1b; --grey:#5f5f5f; --grey-deep:#262626;
    --fd:"Inter Tight","Helvetica Neue",Arial,sans-serif; --fm:"JetBrains Mono",ui-monospace,monospace;
    --mid:#a3a3a3; --line:rgba(255,255,255,.1); --paper:#ededeb; --gut:clamp(16px,4vw,56px);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:72px}
  body{background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .display{font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:.9}
  .eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);font-weight:600;display:flex;gap:14px;align-items:center}
  .eyebrow b{color:var(--paper);font-weight:600}
  .wrap{max-width:1280px;margin:0 auto;padding:0 var(--gut)}
  section{position:relative}
  .btn{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(237,237,235,.55);padding:12px 18px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;transition:background .2s,color .2s,border-color .2s}
  .btn:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .btn.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .btn.solid:hover{background:transparent;color:var(--paper)}
  .tbd{display:inline-block;font-family:var(--fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;border:1px dashed rgba(255,255,255,.35);color:var(--mid);padding:3px 7px;vertical-align:middle}

  /* ---------- nav ---------- */
  .nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:18px var(--gut);transition:background .3s,padding .3s,border-color .3s;border-bottom:1px solid transparent}
  .nav.scrolled{background:rgba(11,11,11,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:12px;padding-bottom:12px;border-color:var(--line)}
  .nav .logo{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
  .nav ul{list-style:none;display:flex;gap:28px}
  .nav ul a{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;opacity:.8;transition:opacity .2s}
  .nav ul a:hover,.nav ul a.on{opacity:1}
  .nav ul a span{font-family:var(--fm);color:var(--mid);margin-right:6px;font-weight:400}
  .nav ul a b{font-weight:inherit}
  .burger{display:none;background:none;border:0;color:inherit;width:40px;height:40px;cursor:pointer;position:relative}
  .burger i{position:absolute;left:9px;right:9px;height:2px;background:currentColor;transition:transform .25s,opacity .25s}
  .burger i:nth-child(1){top:13px}.burger i:nth-child(2){top:19px}.burger i:nth-child(3){top:25px}
  .menu-open .burger i:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .menu-open .burger i:nth-child(2){opacity:0}
  .menu-open .burger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

  /* ---------- hero ---------- */
  .hero{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr auto;isolation:isolate;overflow:hidden}
  .hero .photo{position:absolute;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 75% 40%,#6a6a6a 0%,var(--grey) 45%,var(--grey-deep) 100%)}
  .hero .photo img{position:absolute;right:0;top:0;height:100%;width:auto;max-width:none;animation:zoom 14s ease-out both;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
  .hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--grey-deep) 0%,rgba(38,38,38,.55) 40%,rgba(38,38,38,0) 62%),linear-gradient(0deg,rgba(11,11,11,.9) 0%,rgba(0,0,0,0) 30%),linear-gradient(180deg,rgba(11,11,11,.7) 0%,rgba(0,0,0,0) 22%)}
  .hero .photo video{position:absolute;right:0;top:0;height:100%;width:auto;aspect-ratio:9/16;object-fit:cover;object-position:50% 0;opacity:0;transition:opacity 1.2s ease;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%);mask-image:linear-gradient(90deg,transparent 0,#000 34%)}
  .hero .photo.playing video{opacity:1}
  .hero .photo.playing img{opacity:0;transition:opacity 1.2s ease}
  @keyframes zoom{from{transform:scale(1.06)}to{transform:scale(1)}}
  .hero main{align-self:center;padding:110px var(--gut) 40px;max-width:900px}
  .hero h1{font-size:clamp(54px,10.4vw,150px);position:relative;z-index:0;text-shadow:0 0 14px rgba(255,255,255,.16),0 0 48px rgba(255,255,255,.08);animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
  .hero h1::before{content:"";position:absolute;z-index:-1;left:-12%;right:-18%;top:-45%;bottom:-45%;background:radial-gradient(closest-side,rgba(255,255,255,.22),rgba(225,225,225,.08) 55%,rgba(200,200,200,0) 100%);filter:blur(36px);pointer-events:none;animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
  .hero .role{font-family:var(--fd);text-transform:uppercase;font-size:clamp(18px,2.6vw,32px);color:var(--mid);margin-top:14px;animation:rise 1s .15s cubic-bezier(.2,.7,.2,1) both}
  .hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;animation:rise 1s .3s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  .ticker{background:var(--ink);overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .ticker .track{display:inline-flex;animation:marquee 34s linear infinite}
  .ticker span{font-family:var(--fd);text-transform:uppercase;font-size:clamp(14px,1.5vw,17px);letter-spacing:.04em;padding:13px 0}
  .ticker span::after{content:"✦";margin:0 22px;color:var(--mid);font-size:.8em;vertical-align:middle}
  .ticker.big span{font-size:clamp(36px,6vw,82px);padding:18px 0;color:transparent;-webkit-text-stroke:1px rgba(237,237,235,.45)}
  .ticker.big span:nth-child(odd){color:var(--paper);-webkit-text-stroke:0}
  .ticker.big .track{animation-duration:50s}
  @keyframes marquee{to{transform:translateX(-50%)}}

  /* ---------- secciones ---------- */
  .block{padding:clamp(80px,12vw,150px) 0}
  .block h2{font-size:clamp(40px,6.4vw,86px);margin:18px 0 0}
  .block h2 em{font-style:normal;color:transparent;-webkit-text-stroke:1px rgba(237,237,235,.6)}

  /* bio */
  .bio{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(32px,6vw,90px);align-items:start;margin-top:56px}
  .bio figure{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--panel)}
  .bio figure img{width:100%;height:100%;object-fit:cover;filter:contrast(1.05)}
  .bio figure figcaption{position:absolute;left:16px;bottom:14px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
  .bio .text p{font-size:clamp(16px,1.35vw,18px);color:#cfcfcd;margin-bottom:18px;max-width:58ch}
  .bio .text p:first-of-type{font-size:clamp(18px,1.6vw,21px);color:var(--paper);line-height:1.5}
  /* bio larga: se recorta a la altura de la foto y se abre con "Bio full" */
  .bio-clip{position:relative;overflow:hidden;transition:max-height .7s cubic-bezier(.2,.7,.2,1)}
  .bio-clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(180deg,rgba(11,11,11,0),var(--ink));pointer-events:none;transition:opacity .4s}
  .bio-clip.open::after,.bio-clip.fits::after{opacity:0}
  .bio-more{margin-top:20px;display:inline-flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid rgba(237,237,235,.35);padding:0 0 6px;color:var(--mid);font-family:var(--fm);font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s}
  .bio-more:hover{color:var(--paper);border-color:var(--paper)}
  .bio-more:focus-visible{outline:2px solid var(--paper);outline-offset:4px}
  .bio-more i{font-style:normal;display:inline-block;transition:transform .3s}
  .bio-more[aria-expanded="true"] i{transform:rotate(45deg)}
  .bio-more[hidden]{display:none}

  /* música */
  .music{background:var(--deep);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .music-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(28px,5vw,70px);margin-top:56px;align-items:start}
  .player{border:1px solid var(--line);background:var(--ink);min-height:360px;display:grid}
  .player.video{min-height:0;aspect-ratio:16/9}
  .player.video iframe{min-height:0;filter:grayscale(1);transition:filter .5s}
  .player.video:hover iframe,.player.video:focus-within iframe{filter:none}
  .player iframe{width:100%;height:100%;min-height:360px;border:0;filter:grayscale(1)}
  .player .empty{display:grid;place-content:center;text-align:center;gap:14px;padding:40px;color:var(--mid)}
  .player .empty .display{font-size:30px;color:var(--paper)}
  .platforms{list-style:none;border-top:1px solid var(--line)}
  .platforms a{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);font-family:var(--fd);text-transform:uppercase;font-size:clamp(18px,2vw,26px);transition:padding .25s,color .25s}
  .platforms a::after{content:"↗";font-family:Inter,sans-serif;font-size:20px;color:var(--mid)}
  .platforms a:hover{padding-left:14px;color:#fff}

  /* fechas */
  .dates h3{font-family:var(--fm);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);font-weight:600;margin:56px 0 10px}
  .gig{display:grid;grid-template-columns:150px 1.2fr 1fr 130px;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);transition:background .2s,padding .25s}
  .gig:first-of-type{border-top:1px solid var(--line)}
  .gig:hover{background:rgba(255,255,255,.03);padding-left:12px;padding-right:12px}
  .gig .d{font-family:var(--fd);font-weight:700;font-size:23px;line-height:1}
  .gig .d small{display:block;font-family:var(--fm);font-weight:400;font-size:11px;letter-spacing:.1em;color:var(--mid);margin-top:6px}
  .gig .where{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:clamp(17px,1.8vw,23px);line-height:1.05}
  .gig .venue{font-family:var(--fm);color:var(--mid);font-size:13px;letter-spacing:.02em}
  .gig.past{opacity:.55}
  .gig .btn{padding:10px 14px;font-size:11px;justify-self:end}

  /* galería */
  /* galería en carrusel */
  .carousel{margin-top:56px}
  .gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .gallery::-webkit-scrollbar{display:none}
  .gallery .slide{flex:0 0 auto;width:clamp(240px,34vw,460px);aspect-ratio:2/3;scroll-snap-align:start;position:relative;overflow:hidden;border:0;padding:0;background:var(--panel);cursor:zoom-in}
  .gallery img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .4s;filter:grayscale(1) brightness(.92)}
  .gallery .slide:hover img{transform:scale(1.04);filter:grayscale(1) brightness(1.05)}
  .car-ui{display:flex;align-items:center;gap:20px;margin-top:22px}
  .count{font-family:var(--fm);font-size:12px;letter-spacing:.1em;color:var(--mid);min-width:64px;font-variant-numeric:tabular-nums}
  .car-bar{flex:1;height:1px;background:var(--line);position:relative;overflow:hidden}
  .car-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--paper);width:20%;transition:transform .35s ease,width .35s ease}
  .car-btns{display:flex;gap:8px}
  .car-btn{width:48px;height:48px;border-radius:50%;border:1px solid rgba(237,237,235,.4);background:none;color:var(--paper);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s,border-color .2s,opacity .2s}
  .car-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
  .car-btn:hover:not(:disabled){background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .car-btn:focus-visible,.gallery .slide:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
  .car-btn:disabled{opacity:.3;cursor:default}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(5,5,5,.94);display:grid;place-items:center;padding:24px;visibility:hidden}
  .lightbox.open{visibility:visible}
  .lightbox img{max-height:88vh;width:auto}
  
  /* booking */
  .booking{text-align:center}
  .booking h2{font-size:clamp(50px,9.4vw,128px)}
  .booking .lead{max-width:560px;margin:22px auto 0;color:#cfcfcd}
  .mail{display:inline-block;margin-top:34px;font-family:var(--fd);font-weight:700;font-size:clamp(20px,3.2vw,42px);text-transform:uppercase;border-bottom:2px solid var(--paper);padding-bottom:6px;transition:color .2s,border-color .2s;word-break:break-all}
  .booking .presskit{margin-top:34px}
  .mail:hover{color:var(--mid);border-color:var(--mid)}
  .contacts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:70px auto 0;max-width:980px;border-top:1px solid var(--line);text-align:left}
  .contacts div{padding:24px 20px 0}
  .contacts div+div{border-left:1px solid var(--line)}
  .contacts small{display:block;font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);margin-bottom:8px}
  .contacts a{font-weight:600}
  .socials{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:56px}

  /* redes: solo iconos, sutiles */
  .soc{display:flex;gap:22px;align-items:center}
  .soc a{width:28px;height:28px;display:grid;place-items:center;color:var(--paper);opacity:.55;transition:opacity .25s,transform .25s}
  .soc a:hover{opacity:1;transform:translateY(-2px)}
  .soc a:focus-visible{outline:1px solid var(--paper);outline-offset:4px}
  .soc svg{width:17px;height:17px;fill:currentColor}
  .socials{gap:34px}
  .socials svg{width:22px;height:22px}
  .nav ul .menu-soc{display:none}
  footer{align-items:center}
  /* mini reproductor "Radio Show" (fijo, abajo a la izquierda) */
  .radio{position:fixed;left:var(--gut);bottom:18px;z-index:60;display:flex;align-items:center;gap:12px;padding:7px 14px 7px 7px;border:1px solid var(--line);border-radius:999px;background:rgba(11,11,11,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);transition:color .3s,border-color .3s}
  .radio.on{color:var(--paper);border-color:rgba(237,237,235,.3)}
  .radio button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(237,237,235,.4);background:none;color:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .2s,color .2s}
  .radio button:hover{background:var(--paper);color:var(--ink)}
  .radio button:focus-visible,.radio input:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
  .radio svg{width:12px;height:12px;fill:currentColor}
  .radio .pa{display:none}.radio.on .pl{display:none}.radio.on .pa{display:block}
  .radio .eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px;margin-right:-4px;width:0;opacity:0;overflow:hidden;transition:opacity .3s,width .3s}
  .radio .eq i{width:2px;background:currentColor;height:3px;flex:none}
  .radio.on .eq{opacity:1;width:10px}.radio.on .eq i{animation:eq .9s ease-in-out infinite}
  .radio.on .eq i:nth-child(2){animation-delay:.2s}.radio.on .eq i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:10px}}
  .radio input{-webkit-appearance:none;appearance:none;width:64px;height:2px;background:linear-gradient(90deg,var(--paper) var(--v,50%),rgba(237,237,235,.25) var(--v,50%));border-radius:2px;cursor:pointer}
  .radio input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--paper);border:0}
  .radio input::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--paper);border:0}
  .radio iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:0;top:0}
  @media (max-width:520px){.radio{bottom:12px;gap:10px}.radio input{width:48px}}
  footer{border-top:1px solid var(--line);padding:28px var(--gut);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
  footer .logo{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--paper)}

  /* aparición al hacer scroll */
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  /* ---------- móvil ---------- */
  @media (max-width:900px){
    .nav ul{position:fixed;inset:0;background:rgba(11,11,11,.97);flex-direction:column;justify-content:center;align-items:center;gap:26px;opacity:0;pointer-events:none;transition:opacity .3s}
    .nav ul a{font-family:var(--fd);font-size:30px;letter-spacing:0;font-weight:700;opacity:1}
    .nav ul a span{font-family:var(--fm);font-size:13px;vertical-align:top}
    .menu-open .nav ul{opacity:1;pointer-events:auto}
    .nav ul .menu-soc{display:block;margin-top:14px}
    .nav ul .menu-soc .soc{gap:30px}
    .nav ul .menu-soc .soc a{font-size:0;opacity:.6}
    .nav ul .menu-soc .soc svg{width:21px;height:21px}
    .burger{display:block;z-index:2}
    .bio,.music-grid{grid-template-columns:1fr}
    .bio figure{max-height:70vh}
    .gig{grid-template-columns:90px 1fr;gap:6px 16px}
    .gig .d{grid-row:span 2;font-size:21px}
    .gig .btn{grid-column:2;justify-self:start;margin-top:8px}
    .gallery .slide{width:78vw}
    .contacts{grid-template-columns:1fr}
    .contacts div+div{border-left:0;border-top:1px solid var(--line);margin-top:22px}
  }
  @media (max-width:760px){
    .hero .photo img{right:50%;transform:translateX(50%);animation:none;-webkit-mask-image:none;mask-image:none}
    .hero .photo video{width:100%;aspect-ratio:auto;object-position:50% 0;-webkit-mask-image:none;mask-image:none}
    .hero .photo::after{background:linear-gradient(0deg,var(--ink) 0%,rgba(30,30,30,.8) 38%,rgba(38,38,38,0) 62%,rgba(0,0,0,.3) 100%)}
    .hero main{align-self:end;padding-top:46vh}
      }
  @media (prefers-reduced-motion:reduce){body::after{display:none}*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}
  /* logo */
  .nav .logo img{height:38px;width:auto;transition:height .3s}
  .nav.scrolled .logo img{height:32px}
  footer .logo img{height:30px;width:auto}
  /* botón de idioma (esfera del mundo) */
  .nav .right{display:flex;align-items:center;gap:18px}
  .lang{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid rgba(237,237,235,.35);color:inherit;border-radius:999px;padding:6px 12px 6px 7px;cursor:pointer;font-family:var(--fm);font-size:12px;letter-spacing:.08em;transition:background .2s,color .2s,border-color .2s;z-index:2}
  .lang:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .lang:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

  bio: {
    en: [
      "Born on Margarita Island (Venezuela) in 2002 and based in Barcelona, INDRIAGO is an electronic music DJ and producer. He grew up surrounded by the Caribbean, among the salsa, merengue and drums that played on every corner, and perhaps that is why rhythm has always been at the heart of his music. At 13, a DJ friend taught him the basics of the craft. What began as curiosity soon became an obsession: hours practising transitions, digging for new music and studying sets by the biggest names in the genre.",

      "Over the years his sound has taken shape: tech house and afro house with groove, punchy percussion and a constant nod to his Latin roots. His sets move from hypnotic to explosive, and are always built to keep the dancefloor moving.",

    es: [
      "Nacido en la Isla de Margarita (Venezuela) en 2002 y afincado en Barcelona, INDRIAGO es DJ y productor de música electrónica. Creció rodeado del Caribe, entre la salsa, el merengue y los tambores que sonaban en cada esquina, y quizá por eso el ritmo siempre ha sido el centro de su música. A los 13 años, un amigo DJ le enseñó las bases del oficio. Lo que empezó como curiosidad se convirtió pronto en obsesión: horas practicando transiciones, buscando música nueva y estudiando sets de los grandes nombres del género.",
      "Sus primeros pasos fueron en fiestas privadas, donde aprendió lo más importante de la cabina: leer a la pista. Con su carisma, su energía y el apoyo de su comunidad, pasó de las fiestas entre amigos a los mejores clubes de la isla, y se hizo un nombre propio en la escena de Margarita cuando todavía era muy joven.",

      load("https://www.youtube.com/iframe_api");
    }
  })();

  // foto ampliada: anterior / siguiente, teclado, deslizar y cerrar
  var lbImg = lbx.querySelector("img"), lbAt = 0, lbFrom = null;
  function lbShow(i){
    lbAt = (i + N) % N; var sl = slides[lbAt];
    lbImg.src = sl.dataset.full; lbImg.alt = sl.querySelector("img").alt;
    lbx.querySelector(".lb-count").textContent = String(lbAt+1).padStart(2,"0") + " / " + String(N).padStart(2,"0");
  }
  function lbOpen(i){ lbFrom = document.activeElement; lbShow(i); lbx.classList.add("open"); lbx.querySelector(".lb-close").focus({preventScroll:true}) }
  function lbClose(){ if(!lbx.classList.contains("open")) return; lbx.classList.remove("open"); if (lbFrom) lbFrom.focus({preventScroll:true}) }
  slides.forEach(function(b, i){ b.addEventListener("click", function(){ lbOpen(i) }) });
  lbx.querySelector(".lb-prev").addEventListener("click", function(){ lbShow(lbAt-1) });
  lbx.querySelector(".lb-next").addEventListener("click", function(){ lbShow(lbAt+1) });
  lbx.addEventListener("click", function(e){ if(e.target===lbx || e.target.closest(".lb-close")) lbClose() });
  var tx = null;
  lbx.addEventListener("touchstart", function(e){ tx = e.touches[0].clientX }, {passive:true});
  lbx.addEventListener("touchend", function(e){ if(tx===null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) lbShow(lbAt + (dx < 0 ? 1 : -1)); tx = null });
  addEventListener("keydown", function(e){
    if (lbx.classList.contains("open")) {
      if (e.key==="ArrowRight") lbShow(lbAt+1);
      if (e.key==="ArrowLeft") lbShow(lbAt-1);
    }
    if(e.key==="Escape"){ lbClose(); setMenu(false) }
  });
})();
</script>

<!-- ====== Animación de scroll cinemática (GSAP + ScrollTrigger + Lenis, alojados en assets/js) ====== -->
<script src="assets/js/gsap.min.js"></script>
<script src="assets/js/ScrollTrigger.min.js"></script>
<script src="assets/js/lenis.min.js"></script>
<script>
(function(){
  if (!window.gsap || !window.ScrollTrigger) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;   // respeta a quien pide menos movimiento
  document.documentElement.classList.add("fx");
  gsap.registerPlugin(ScrollTrigger);
  var U = gsap.utils.toArray;

  // scroll suave
  var lenis = window.Lenis ? new Lenis({ lerp: .09 }) : null;
  if (lenis) {
    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add(function(t){ lenis.raf(t * 1000) });
    gsap.ticker.lagSmoothing(0);
    document.querySelectorAll('a[href^="#"]').forEach(function(a){
      a.addEventListener("click", function(e){
        var id = a.getAttribute("href");
        if (id.length > 1 && document.querySelector(id)) { e.preventDefault(); lenis.scrollTo(id, { offset: -60 }) }
        else if (id === "#top") { e.preventDefault(); lenis.scrollTo(0) }
      });
    });
    // parar el scroll suave mientras el menú móvil o la foto ampliada están abiertos
    new MutationObserver(function(){
      var lock = document.body.classList.contains("menu-open") || document.getElementById("lb").classList.contains("open");
      lock ? lenis.stop() : lenis.start();
    }).observe(document.body, { attributes: true, subtree: true, attributeFilter: ["class"] });
  }

  // entrada de la portada
  gsap.from(".hero-name", { yPercent: 12, opacity: 0, duration: 1.2, ease: "power3.out", delay: .1 });
  gsap.from(".hero .strip .cell", { y: 16, opacity: 0, duration: .8, stagger: .08, ease: "power3.out", delay: .45 });

  // portada fija: la foto se acerca y oscurece y el nombre crece
  // y el video avanza fotograma a fotograma: la cara gira hacia la cámara al bajar
  var hv = document.getElementById("heroVid"), want = 0, shown = 0, busy = false;
  function seek(){
    if (!hv || !hv.duration) return;
    shown += (want - shown) * .25;                       // suavizado
    if (Math.abs(want - shown) < .002) shown = want;
    if (!busy) { busy = true; hv.currentTime = shown * (hv.duration - .05) }
  }
  if (hv) { hv.addEventListener("seeked", function(){ busy = false }); gsap.ticker.add(seek) }
  gsap.timeline({ scrollTrigger: { trigger: ".hero", start: "top top", end: "+=110%", scrub: .6, pin: true,
      onUpdate: function(st){ want = Math.min(1, st.progress / .8) } } })
    .fromTo(".hero .photo", { scale: 1, filter: "brightness(1)" }, { scale: 1.15, filter: "brightness(.6)", ease: "none" }, 0)
    .to(".hero-name", { yPercent: -22, ease: "none" }, 0)
    .to(".hero .strip", { opacity: 0, ease: "none" }, .5);

  // títulos: la línea de debajo se dibuja al entrar (sin dejar el título a medias)
  U(".sec-head").forEach(function(h){
    gsap.fromTo(h, { "--rule": 0 }, { "--rule": 1, ease: "power2.out", duration: 1.1, scrollTrigger: { trigger: h, start: "top 88%" } });
  });
  // la cinta grande se inclina
  gsap.fromTo(".ticker.big", { rotation: -4 }, { rotation: 4, ease: "none",
    scrollTrigger: { trigger: ".ticker.big", start: "top bottom", end: "bottom top", scrub: true } });
  // las fotos se acercan un poco al entrar (siempre visibles)
  U(".carousel, .bio figure").forEach(function(box){
    gsap.fromTo(box, { scale: .94 }, { scale: 1, ease: "none",
      scrollTrigger: { trigger: box, start: "top 100%", end: "top 50%", scrub: true } });
  });

  addEventListener("load", function(){ ScrollTrigger.refresh() });
  document.fonts && document.fonts.ready.then(function(){ ScrollTrigger.refresh() });
})();
</script>
</body>
</html>
