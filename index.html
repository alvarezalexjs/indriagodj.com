<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indriago — Próximamente</title>
<meta name="description" content="La nueva web oficial de Indriago está en construcción.">
<meta property="og:title" content="Indriago — Próximamente">
<meta property="og:description" content="La nueva web oficial de Indriago está en construcción.">
<meta property="og:image" content="https://indriagodj.com/assets/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#262626">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ====== EDITA AQUÍ ====== colores */
  :root{
    --grey:#5f5f5f; --grey-deep:#262626; --mid:#a3a3a3; --ink:#0e0e0e; --paper:#ededeb; color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--grey);color:var(--paper);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  .stage{position:relative;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto auto;isolation:isolate;overflow:hidden}
  .photo{position:absolute;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 75% 40%,#6a6a6a 0%,var(--grey) 45%,var(--grey-deep) 100%)}
  .photo img{position:absolute;right:0;top:0;height:100%;width:auto;max-width:none;object-fit:cover;animation:zoom 14s ease-out both;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);mask-image:linear-gradient(90deg,transparent 0,#000 30%)}
  .photo::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,var(--grey-deep) 0%,rgba(38,38,38,.55) 40%,rgba(38,38,38,0) 62%),
               linear-gradient(0deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 35%)}
  @keyframes zoom{from{transform:scale(1.06)}to{transform:scale(1)}}

  header{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(16px,4vw,48px);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
  header .tag{opacity:.75}

  main{align-self:center;padding:0 clamp(16px,4vw,48px);max-width:820px}
  .kicker{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.8;margin-bottom:14px}
  h1{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.86;font-size:clamp(72px,15vw,200px);letter-spacing:.01em;animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
  /* luz difuminada detrás del nombre */
  h1{position:relative;z-index:0;text-shadow:0 0 14px rgba(255,255,255,.16),0 0 48px rgba(255,255,255,.08)}
  h1::before{content:"";position:absolute;z-index:-1;left:-12%;right:-18%;top:-45%;bottom:-45%;
    background:radial-gradient(closest-side,rgba(255,255,255,.22),rgba(225,225,225,.08) 55%,rgba(200,200,200,0) 100%);
    filter:blur(36px);pointer-events:none;animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
  h2{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(28px,4.4vw,56px);line-height:1;margin-top:10px;color:var(--mid);-webkit-text-stroke:0;animation:rise 1s .15s cubic-bezier(.2,.7,.2,1) both}
  main p{margin-top:18px;max-width:420px;font-size:15px;line-height:1.55;opacity:.9;animation:rise 1s .3s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;animation:rise 1s .45s cubic-bezier(.2,.7,.2,1) both}
  .links a{border:1px solid rgba(245,241,234,.55);padding:10px 16px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;transition:background .2s,color .2s}
  .links a:hover{background:var(--paper);color:var(--ink)}

  .ticker{background:var(--ink);color:var(--paper);overflow:hidden;white-space:nowrap;border-top:1px solid rgba(255,255,255,.08);margin-top:40px}
  .ticker .track{display:inline-flex;animation:marquee 28s linear infinite}
  .ticker span{font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-size:clamp(16px,2vw,22px);letter-spacing:.06em;padding:12px 0}
  .ticker span::after{content:"✦";margin:0 22px;color:var(--mid);font-size:.8em;vertical-align:middle}
  @keyframes marquee{to{transform:translateX(-50%)}}

  footer{background:var(--ink);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px clamp(16px,4vw,48px);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.95;border-top:1px solid rgba(255,255,255,.08)}
  footer span{opacity:.6}

  @media (max-width:760px){
    .photo img{right:50%;transform:translateX(50%);animation:none;-webkit-mask-image:none;mask-image:none}
    .photo::after{background:linear-gradient(0deg,var(--grey-deep) 0%,rgba(38,38,38,.8) 40%,rgba(38,38,38,0) 62%,rgba(0,0,0,.25) 100%)}
    main{align-self:end;padding-top:46vh}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="photo"><img src="assets/hero.jpg" alt="Retrato de Indriago en blanco y negro" fetchpriority="high"></div>

  <header>
    <a href="/">Indriago</a>
    <span class="tag">Página temporal</span>
  </header>

  <main>
    <div class="kicker">DJ · Productor</div>
    <h1>Indriago</h1>
    <h2>Coming Soon</h2>
    <p>La nueva web oficial está en construcción. Mientras tanto, síguenos en redes o escríbenos para booking.</p>
    <!-- ====== EDITA AQUÍ ====== enlaces (provisionales) -->
    <nav class="links">
      <a href="https://instagram.com/indriago" target="_blank" rel="noopener">Instagram</a>
      <a href="https://soundcloud.com/indriago" target="_blank" rel="noopener">SoundCloud</a>
      <a href="mailto:booking@indriagodj.com">Booking</a>
    </nav>
  </main>

  <div class="ticker" aria-hidden="true"><div class="track" id="track"></div></div>

  <footer>
    <div>© <span id="y" style="opacity:1">2026</span> Indriago</div>
    <span>Nueva web muy pronto</span>
  </footer>
</div>
<script>
  // ====== EDITA AQUÍ ====== frases del ticker
  var phrases=["Nueva web muy pronto","indriagodj.com","En construcción","Coming soon"];
  var t=document.getElementById("track"),html="";
  for(var i=0;i<8;i++)phrases.forEach(function(p){html+="<span>"+p+"</span>"});
  t.innerHTML=html;
  document.getElementById("y").textContent=new Date().getFullYear();
</script>
</body>
</html>
